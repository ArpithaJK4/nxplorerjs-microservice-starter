name: CI - Nxplorer Microservice

on:
  push:
    branches:
      - main
      - develop
      - patch-1
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:20.10.16
        options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: |
          echo "Fixing test for swapi.dev..."
          cp ./__mocks__/swapi.mock.js ./server/api/services/  # Add this if using a mock file
          npm run test

      - name: Build Docker Image
        run: docker build -t nxplorerjs-microservice .

      - name: Run Docker Compose
        run: docker-compose up -d

      - name: Verify Services
        run: |
          sleep 10
          curl -f http://localhost:3000 || exit 1
