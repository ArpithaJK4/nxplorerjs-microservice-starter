name: Node.js CI

on:
  push:
    branches: [main, develop, patch-1]
  pull_request:
    branches: [main, develop, patch-1]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Fix swapi tests (mock usage or skip test)
        run: |
          echo "Ensure swapi.dev is mocked or test is skipped"
          # If you have a mock file, uncomment below and add it
          # cp ./__mocks__/swapi.mock.js ./server/api/services/

      - name: Run tests
        run: npm run test

      - name: Upload test coverage (optional)
        if: success()
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
